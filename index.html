<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Voxel - Cozy Restoration</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #info {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(0, 0, 0, 0.6); padding: 12px; border-radius: 8px;
            pointer-events: none;
        }
        h1 { margin: 0 0 5px 0; font-size: 16px; color: #a8e6cf; }
        p { margin: 2px 0; font-size: 13px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="info">
        <h1>🌸 Bloom Voxel Restoration</h1>
        <p><b>Klik Kiri:</b> Siram Air / Tumbuhkan Bunga</p>
        <p><b>Klik Kanan & Drag:</b> Putar Kamera 3D</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xdff9fb);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 10, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffae6, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const cubes = [];
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        
        const matCorrupted = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
        const matGrass = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });

        for (let x = -2; x <= 2; x++) {
            for (let z = -2; z <= 2; z++) {
                const cube = new THREE.Mesh(geometry, matCorrupted.clone());
                cube.position.set(x, 0, z);
                cube.castShadow = true;
                cube.receiveShadow = true;
                cube.userData = { isRestored: false };
                scene.add(cube);
                cubes.push(cube);
            }
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cubes);

            if (intersects.length > 0) {
                const clickedCube = intersects[0].object;
                
                if (!clickedCube.userData.isRestored) {
                    clickedCube.material = matGrass;
                    clickedCube.userData.isRestored = true;
                    
                    const flowerGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                    const flowerMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
                    const flower = new THREE.Mesh(flowerGeo, flowerMat);
                    flower.position.set(clickedCube.position.x, 0.65, clickedCube.position.z);
                    scene.add(flower);
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            scene.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
